name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Блокирующие проверки: должны быть зелёными перед мержем.
  html:
    name: HTML и ссылки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Валидация HTML
        run: npm run lint:html

      - name: Проверка локальных ссылок и ассетов
        run: npm run check:links

  # Консультативные проверки: пока не блокируют мерж.
  # TODO: сделать блокирующими после исправления известных дефектов из REVIEW.md.
  a11y:
    name: Доступность (pa11y)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Запуск статического сервера
        run: |
          python3 -m http.server 8080 > /dev/null 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/ > /dev/null && break
            sleep 1
          done

      - name: Проверка доступности
        run: npx --yes pa11y-ci@5 --config .pa11yci.json

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Аудит Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
